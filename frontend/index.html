<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#010102" />
    <meta name="description" content="Workspace file drive for ICEDR" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>ICEDR</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
        background: var(--background, #f5f6f6);
        color: var(--foreground, #111217);
      }
    </style>
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("icedr.ui.themeMode");
          const theme =
            storedTheme === "dark" || storedTheme === "light"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
