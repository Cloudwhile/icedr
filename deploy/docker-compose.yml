services:
  icedr:
    image: ${ICEDR_IMAGE:-icedr-po}:${ICEDR_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: icedr
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-13000}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_DBNAME: ${REDIS_DBNAME:-}
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      MINIO_METRICS_ENDPOINT: ${MINIO_METRICS_ENDPOINT:-}
      MINIO_METRICS_BEARER_TOKEN: ${MINIO_METRICS_BEARER_TOKEN:-}
      LOCAL_STORAGE_ROOT: ${LOCAL_STORAGE_ROOT:-/workspace/backend/data/local-files}
      PUBLIC_SHARE_BASE_URL: ${PUBLIC_SHARE_BASE_URL:-}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      SHARE_EMAIL_PROVIDER: ${SHARE_EMAIL_PROVIDER:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ICEDR}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      DEFAULT_WORKSPACE_ACTOR: ${DEFAULT_WORKSPACE_ACTOR:-Workspace User}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13000/api/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "13000:13000"
    volumes:
      - icedr-data:/workspace/backend/data

volumes:
  icedr-data:
