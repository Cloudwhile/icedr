services:
  icedr:
    image: ${ICEDR_IMAGE:-icedr-po}:${ICEDR_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: icedr
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_HOST: ${ICEDR_DOCKER_API_HOST:-0.0.0.0}
      API_PORT: ${ICEDR_DOCKER_API_PORT:-13000}
      API_CORS_ORIGIN: ${ICEDR_DOCKER_API_CORS_ORIGIN:-}
      DATABASE_HOST: ${ICEDR_DOCKER_DATABASE_HOST:-}
      DATABASE_PORT: ${ICEDR_DOCKER_DATABASE_PORT:-}
      DATABASE_DBNAME: ${ICEDR_DOCKER_DATABASE_DBNAME:-}
      DATABASE_USER: ${ICEDR_DOCKER_DATABASE_USER:-}
      DATABASE_PASSWORD: ${ICEDR_DOCKER_DATABASE_PASSWORD:-}
      REDIS_HOST: ${ICEDR_DOCKER_REDIS_HOST:-}
      REDIS_PORT: ${ICEDR_DOCKER_REDIS_PORT:-}
      REDIS_DBNAME: ${ICEDR_DOCKER_REDIS_DBNAME:-}
      REDIS_USER: ${ICEDR_DOCKER_REDIS_USER:-}
      REDIS_PASSWORD: ${ICEDR_DOCKER_REDIS_PASSWORD:-}
      S3_ENDPOINT: ${ICEDR_DOCKER_S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${ICEDR_DOCKER_S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${ICEDR_DOCKER_S3_REGION:-}
      S3_BUCKET: ${ICEDR_DOCKER_S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${ICEDR_DOCKER_S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${ICEDR_DOCKER_S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${ICEDR_DOCKER_S3_FORCE_PATH_STYLE:-}
      MINIO_METRICS_ENDPOINT: ${ICEDR_DOCKER_MINIO_METRICS_ENDPOINT:-}
      MINIO_METRICS_BEARER_TOKEN: ${ICEDR_DOCKER_MINIO_METRICS_BEARER_TOKEN:-}
      LOCAL_STORAGE_ROOT: ${ICEDR_DOCKER_LOCAL_STORAGE_ROOT:-/workspace/backend/data/local-files}
      PUBLIC_SHARE_BASE_URL: ${ICEDR_DOCKER_PUBLIC_SHARE_BASE_URL:-}
      API_PUBLIC_BASE_URL: ${ICEDR_DOCKER_API_PUBLIC_BASE_URL:-}
      SHARE_EMAIL_PROVIDER: ${ICEDR_DOCKER_SHARE_EMAIL_PROVIDER:-}
      SMTP_ENABLED: ${ICEDR_DOCKER_SMTP_ENABLED:-true}
      SMTP_HOST: ${ICEDR_DOCKER_SMTP_HOST:-}
      SMTP_PORT: ${ICEDR_DOCKER_SMTP_PORT:-}
      SMTP_SECURE: ${ICEDR_DOCKER_SMTP_SECURE:-true}
      SMTP_USERNAME: ${ICEDR_DOCKER_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${ICEDR_DOCKER_SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${ICEDR_DOCKER_SMTP_FROM_NAME:-ICEDR}
      SMTP_FROM_EMAIL: ${ICEDR_DOCKER_SMTP_FROM_EMAIL:-}
      SMTP_REPLY_TO: ${ICEDR_DOCKER_SMTP_REPLY_TO:-}
      DEFAULT_WORKSPACE_ACTOR: ${ICEDR_DOCKER_DEFAULT_WORKSPACE_ACTOR:-Workspace User}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${ICEDR_DOCKER_API_PORT:-13000}/api/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "${ICEDR_DOCKER_HTTP_PORT:-13000}:${ICEDR_DOCKER_API_PORT:-13000}"
    volumes:
      - icedr-data:/workspace/backend/data

volumes:
  icedr-data:
