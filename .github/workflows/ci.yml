name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "fix/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: icedr_ci
          POSTGRES_PASSWORD: icedr_ci_password
          POSTGRES_USER: icedr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icedr_ci -d icedr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL migrations
        run: pnpm --filter backend exec prisma migrate deploy --schema ../database/schema.prisma --config ../prisma.config.ts
        env:
          DATABASE_URL: postgresql://icedr_ci:icedr_ci_password@127.0.0.1:5432/icedr_ci

      - name: Install Playwright browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Setup Go for MinIO
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build MinIO
        # RELEASE.2025-09-07T16-13-09Z; community images are no longer public.
        run: go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
        env:
          CGO_ENABLED: "0"
          GOBIN: ${{ runner.temp }}/minio-bin

      - name: Start MinIO service
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            >"$RUNNER_TEMP/minio.log" 2>&1 &
          minio_pid=$!
          echo "$minio_pid" >"$RUNNER_TEMP/minio.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 1 --max-time 2 \
              http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$minio_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/minio.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
        env:
          MINIO_ROOT_USER: icedr-ci-minio
          MINIO_ROOT_PASSWORD: icedr-ci-minio-secret

      - name: Test
        run: pnpm test
        env:
          STORAGE_INTEGRITY_MINIO_ACCESS_KEY: icedr-ci-minio
          STORAGE_INTEGRITY_MINIO_ENDPOINT: http://127.0.0.1:9000
          STORAGE_INTEGRITY_MINIO_REGION: us-east-1
          STORAGE_INTEGRITY_MINIO_SECRET_KEY: icedr-ci-minio-secret
          STORAGE_INTEGRITY_MINIO_TEST: "1"

      - name: Stop MinIO service
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" 2>/dev/null || true
          fi

      - name: E2E smoke
        run: pnpm test:e2e
